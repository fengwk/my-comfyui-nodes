[project]
name = "my-comfyui-nodes"
version = "0.1.0"
description = "Personal modular ComfyUI custom node pack."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["my_nodes*"]

# The vendored DNR3 native sources, its MinGW build script and - once built -
# the Windows artifacts (host exe, bridge DLL, caller shim) ship with the
# package. NVIDIA runtime DLLs are never part of the package.
[tool.setuptools.package-data]
"my_nodes.core.video_enhance" = ["native/*", "native/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
