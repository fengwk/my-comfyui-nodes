[project]
name = "my-comfyui-nodes"
version = "0.1.0"
description = "Personal modular ComfyUI custom node pack."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["my_nodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
